name: gohot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    # One job, so checkout, Go setup and the cache restore happen once instead
    # of once per check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
        with:
          go-version-file: go.mod
          cache: ${{ !env.ACT }}

      - name: Run go vet
        run: make lint

      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run staticcheck
        run: make staticcheck

      - name: Run govulncheck
        run: make vulcheck

      - name: Verify no committed secrets
        run: |
          if grep -rn "password\|secret\|api_key" --include="*.go" internal/ cmd/ | grep -iv "test\|example\|config\|error\|env\|hash\|validate\|missing\|invalid\|ErrMissing\|ErrInvalid"; then
            echo "::warning::Potential hardcoded secrets found — review flagged lines"
          fi

      # make test-coverage runs the suite with the race detector, so it covers
      # what a separate make test run would.
      - name: Run tests with race detector
        run: make test-coverage

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: test -f build/gohot

      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gohot-linux-amd64
          path: build/gohot
          retention-days: 1
          overwrite: true
